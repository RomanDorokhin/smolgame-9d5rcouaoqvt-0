<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixelDrop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

:root {
–bg: #0f0e17;
–surface: #1a1928;
–surface2: #252438;
–accent: #ff6b35;
–accent2: #ffd23f;
–accent3: #06d6a0;
–accent4: #a855f7;
–text: #fffffe;
–text-dim: #8887a0;
–cell-border: #2a2940;
–radius: 16px;
}

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
width: 100%; height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘Nunito’, sans-serif;
overflow: hidden;
touch-action: none;
}

#app {
display: flex;
flex-direction: column;
height: 100dvh;
max-width: 480px;
margin: 0 auto;
}

/* ── HEADER ── */
#header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 16px 8px;
flex-shrink: 0;
}

#logo {
font-size: 22px;
font-weight: 900;
letter-spacing: -0.5px;
background: linear-gradient(135deg, var(–accent), var(–accent2));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.hbtn {
width: 38px; height: 38px;
border-radius: 10px;
border: none;
background: var(–surface2);
color: var(–text);
font-size: 17px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: transform .1s, background .15s;
flex-shrink: 0;
}
.hbtn:active { transform: scale(.88); }

#header-right { display: flex; gap: 8px; }

/* ── SIZE SELECTOR ── */
#size-bar {
display: flex;
gap: 6px;
padding: 0 16px 10px;
flex-shrink: 0;
}

.size-btn {
flex: 1;
padding: 6px 0;
border-radius: 10px;
border: 2px solid var(–surface2);
background: var(–surface);
color: var(–text-dim);
font-family: ‘Nunito’, sans-serif;
font-weight: 800;
font-size: 11px;
cursor: pointer;
transition: all .15s;
}
.size-btn.active {
border-color: var(–accent);
background: var(–accent);
color: #fff;
}

/* ── CANVAS WRAPPER ── */
#canvas-wrap {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
padding: 0 12px;
overflow: hidden;
}

#canvas-wrap canvas {
border-radius: 12px;
box-shadow: 0 0 0 2px var(–surface2), 0 8px 32px rgba(0,0,0,.5);
cursor: crosshair;
touch-action: none;
image-rendering: pixelated;
}

/* ── TOOLS ── */
#tools {
display: flex;
gap: 8px;
padding: 10px 16px 6px;
flex-shrink: 0;
}

.tool-btn {
flex: 1;
height: 44px;
border-radius: 12px;
border: 2px solid var(–surface2);
background: var(–surface);
color: var(–text-dim);
font-size: 20px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: all .15s;
position: relative;
}
.tool-btn.active {
border-color: var(–accent4);
background: rgba(168,85,247,.15);
color: var(–accent4);
}
.tool-btn:active { transform: scale(.88); }

#tool-label {
text-align: center;
font-size: 11px;
font-weight: 700;
color: var(–text-dim);
letter-spacing: .5px;
padding-bottom: 4px;
flex-shrink: 0;
}

/* ── COLOR PALETTE ── */
#palette-wrap {
padding: 0 16px;
flex-shrink: 0;
}

#palette {
display: grid;
grid-template-columns: repeat(10, 1fr);
gap: 5px;
padding: 10px;
background: var(–surface);
border-radius: var(–radius);
border: 1px solid var(–surface2);
}

.color-swatch {
aspect-ratio: 1;
border-radius: 7px;
cursor: pointer;
border: 2px solid transparent;
transition: transform .12s, border-color .1s;
position: relative;
}
.color-swatch.active {
border-color: #fff;
transform: scale(1.18);
z-index: 2;
box-shadow: 0 0 0 1px rgba(0,0,0,.4);
}
.color-swatch:active { transform: scale(.9); }

/* eraser swatch */
.color-swatch.eraser-sw {
background: var(–surface2) !important;
border-color: var(–text-dim) !important;
display: flex; align-items: center; justify-content: center;
font-size: 12px;
}

/* ── BOTTOM BAR ── */
#bottom-bar {
display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 16px 14px;
gap: 8px;
flex-shrink: 0;
}

.action-btn {
flex: 1;
height: 44px;
border-radius: 12px;
border: none;
font-family: ‘Nunito’, sans-serif;
font-weight: 800;
font-size: 13px;
cursor: pointer;
display: flex; align-items: center; justify-content: center; gap: 6px;
transition: transform .1s, filter .1s;
}
.action-btn:active { transform: scale(.92); filter: brightness(.85); }

#btn-fill   { background: var(–accent3); color: #0f2e27; }
#btn-clear  { background: var(–surface2); color: var(–text-dim); }
#btn-save   { background: linear-gradient(135deg, var(–accent), var(–accent2)); color: #fff; flex: 1.5; }

/* ── TOAST ── */
#toast {
position: fixed;
bottom: 90px;
left: 50%;
transform: translateX(-50%) translateY(20px);
background: var(–accent3);
color: #0f2e27;
padding: 10px 20px;
border-radius: 50px;
font-weight: 800;
font-size: 14px;
opacity: 0;
transition: all .3s;
pointer-events: none;
white-space: nowrap;
z-index: 100;
}
#toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

/* ── GRID TOGGLE ── */
#grid-toggle.grid-on { border-color: var(–accent2); color: var(–accent2); background: rgba(255,210,63,.1); }
</style>

</head>
<body>
<div id="app">

  <div id="header">
    <div id="logo">PixelDrop</div>
    <div id="header-right">
      <button class="hbtn" id="undo-btn" title="Отменить">↩</button>
      <button class="hbtn grid-on" id="grid-toggle" title="Сетка">#</button>
    </div>
  </div>

  <div id="size-bar">
    <button class="size-btn" data-size="8">8×8</button>
    <button class="size-btn active" data-size="16">16×16</button>
    <button class="size-btn" data-size="24">24×24</button>
    <button class="size-btn" data-size="32">32×32</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="tools">
    <button class="tool-btn active" id="tool-pen"    data-tool="pen">✏️</button>
    <button class="tool-btn"        id="tool-fill"   data-tool="fill">🪣</button>
    <button class="tool-btn"        id="tool-line"   data-tool="line">📏</button>
    <button class="tool-btn"        id="tool-eraser" data-tool="eraser">🧹</button>
  </div>
  <div id="tool-label">КАРАНДАШ</div>

  <div id="palette-wrap">
    <div id="palette"></div>
  </div>

  <div id="bottom-bar">
    <button class="action-btn" id="btn-clear">🗑 Очистить</button>
    <button class="action-btn" id="btn-save">💾 Сохранить</button>
  </div>

</div>

<div id="toast">Сохранено!</div>

<script>
const COLORS = [
  '#ffffff','#d4d4d4','#a0a0a0','#555555','#111111',
  '#ff595e','#ff924c','#ffca3a','#8ac926','#1982c4',
  '#6a4c93','#f72585','#ff006e','#fb5607','#ffbe0b',
  '#3a86ff','#06d6a0','#118ab2','#073b4c','#370617',
  '#ffd6ff','#e7c6ff','#c8b6ff','#b8c0ff','#bbd0ff',
  '#caffbf','#9bf6ff','#ffd6a5','#fdffb6','#ffadad',
];

const TOOL_NAMES = { pen:'КАРАНДАШ', fill:'ЗАЛИВКА', line:'ЛИНИЯ', eraser:'ЛАСТИК' };

let gridSize = 16;
let cellSize;
let pixels = [];      // flat array of color strings, '' = empty
let undoStack = [];
let currentColor = COLORS[9]; // bright red default
let currentTool = 'pen';
let showGrid = true;
let isDrawing = false;
let lastCell = null;
let lineStart = null;
let linePreview = [];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── INIT ──────────────────────────────────────────────────────────────────
function initGrid(size) {
  gridSize = size;
  pixels = new Array(size * size).fill('');
  undoStack = [];
  linePreview = [];
  resizeCanvas();
  render();
}

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const availW = wrap.clientWidth - 24;
  const availH = wrap.clientHeight - 8;
  const maxCell = Math.floor(Math.min(availW, availH) / gridSize);
  cellSize = Math.max(6, maxCell);
  const px = cellSize * gridSize;
  canvas.width  = px;
  canvas.height = px;
  canvas.style.width  = px + 'px';
  canvas.style.height = px + 'px';
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(previewPixels) {
  const disp = previewPixels ? previewPixels : pixels;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // bg
  ctx.fillStyle = '#1a1928';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // checker for empty cells
  for (let i = 0; i < gridSize * gridSize; i++) {
    const col = i % gridSize;
    const row = Math.floor(i / gridSize);
    if (!disp[i]) {
      const light = (col + row) % 2 === 0;
      ctx.fillStyle = light ? '#252438' : '#1f1e2e';
      ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
    } else {
      ctx.fillStyle = disp[i];
      ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
    }
  }

  // grid lines
  if (showGrid && cellSize >= 8) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= gridSize; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize);
      ctx.lineTo(canvas.width, i * cellSize);
      ctx.stroke();
    }
  }
}

// ── TOOLS ─────────────────────────────────────────────────────────────────
function getCell(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let cx, cy;
  if (e.touches) {
    cx = (e.touches[0].clientX - rect.left) * scaleX;
    cy = (e.touches[0].clientY - rect.top)  * scaleY;
  } else {
    cx = (e.clientX - rect.left) * scaleX;
    cy = (e.clientY - rect.top)  * scaleY;
  }
  const col = Math.floor(cx / cellSize);
  const row = Math.floor(cy / cellSize);
  if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return null;
  return { col, row, idx: row * gridSize + col };
}

function paintCell(cell, color) {
  if (!cell) return;
  pixels[cell.idx] = color;
}

function floodFill(startIdx, targetColor, fillColor) {
  if (targetColor === fillColor) return;
  const stack = [startIdx];
  const visited = new Set();
  while (stack.length) {
    const idx = stack.pop();
    if (visited.has(idx)) continue;
    if (pixels[idx] !== targetColor) continue;
    visited.add(idx);
    pixels[idx] = fillColor;
    const row = Math.floor(idx / gridSize);
    const col = idx % gridSize;
    if (col > 0)            stack.push(idx - 1);
    if (col < gridSize - 1) stack.push(idx + 1);
    if (row > 0)            stack.push(idx - gridSize);
    if (row < gridSize - 1) stack.push(idx + gridSize);
  }
}

function getLinePixels(r0, c0, r1, c1) {
  // Bresenham
  const cells = [];
  let dx = Math.abs(c1 - c0), sx = c0 < c1 ? 1 : -1;
  let dy = -Math.abs(r1 - r0), sy = r0 < r1 ? 1 : -1;
  let err = dx + dy;
  let x = c0, y = r0;
  while (true) {
    if (x >= 0 && x < gridSize && y >= 0 && y < gridSize)
      cells.push(y * gridSize + x);
    if (x === c1 && y === r1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x += sx; }
    if (e2 <= dx) { err += dx; y += sy; }
  }
  return cells;
}

function saveUndo() {
  undoStack.push([...pixels]);
  if (undoStack.length > 50) undoStack.shift();
}

function undo() {
  if (!undoStack.length) return;
  pixels = undoStack.pop();
  render();
  toast('Отменено');
}

// ── EVENTS ────────────────────────────────────────────────────────────────
function onStart(e) {
  e.preventDefault();
  const cell = getCell(e);
  if (!cell) return;
  saveUndo();
  isDrawing = true;
  lastCell = cell;

  if (currentTool === 'pen') {
    paintCell(cell, currentColor);
    render();
  } else if (currentTool === 'eraser') {
    paintCell(cell, '');
    render();
  } else if (currentTool === 'fill') {
    const target = pixels[cell.idx];
    floodFill(cell.idx, target, currentColor);
    render();
    isDrawing = false;
  } else if (currentTool === 'line') {
    lineStart = cell;
  }
}

function onMove(e) {
  e.preventDefault();
  if (!isDrawing) return;
  const cell = getCell(e);
  if (!cell) return;

  if (currentTool === 'pen') {
    if (!lastCell || cell.idx !== lastCell.idx) {
      paintCell(cell, currentColor);
      lastCell = cell;
      render();
    }
  } else if (currentTool === 'eraser') {
    if (!lastCell || cell.idx !== lastCell.idx) {
      paintCell(cell, '');
      lastCell = cell;
      render();
    }
  } else if (currentTool === 'line' && lineStart) {
    const lineIdxs = getLinePixels(lineStart.row, lineStart.col, cell.row, cell.col);
    const preview = [...pixels];
    lineIdxs.forEach(idx => preview[idx] = currentColor);
    render(preview);
    linePreview = lineIdxs;
  }
}

function onEnd(e) {
  e.preventDefault();
  if (!isDrawing) return;
  isDrawing = false;

  if (currentTool === 'line' && lineStart && linePreview.length) {
    linePreview.forEach(idx => pixels[idx] = currentColor);
    linePreview = [];
    lineStart = null;
    render();
  }
  lastCell = null;
}

canvas.addEventListener('mousedown',  onStart, { passive: false });
canvas.addEventListener('mousemove',  onMove,  { passive: false });
canvas.addEventListener('mouseup',    onEnd,   { passive: false });
canvas.addEventListener('mouseleave', onEnd,   { passive: false });
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove',  onMove,  { passive: false });
canvas.addEventListener('touchend',   onEnd,   { passive: false });

// ── PALETTE ───────────────────────────────────────────────────────────────
function buildPalette() {
  const wrap = document.getElementById('palette');
  wrap.innerHTML = '';
  COLORS.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === currentColor ? ' active' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => {
      currentColor = c;
      currentTool = 'pen';
      setTool('pen');
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    });
    wrap.appendChild(sw);
  });
}

// ── TOOL BUTTONS ──────────────────────────────────────────────────────────
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + t)?.classList.add('active');
  document.getElementById('tool-label').textContent = TOOL_NAMES[t] || t.toUpperCase();
}

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => setTool(btn.dataset.tool));
});

// ── SIZE BUTTONS ──────────────────────────────────────────────────────────
document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!confirm('Очистить холст и сменить размер?')) return;
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    initGrid(parseInt(btn.dataset.size));
  });
});

// ── GRID TOGGLE ───────────────────────────────────────────────────────────
document.getElementById('grid-toggle').addEventListener('click', () => {
  showGrid = !showGrid;
  const btn = document.getElementById('grid-toggle');
  btn.classList.toggle('grid-on', showGrid);
  render();
});

// ── UNDO ──────────────────────────────────────────────────────────────────
document.getElementById('undo-btn').addEventListener('click', undo);

// ── CLEAR ─────────────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('Очистить холст?')) return;
  saveUndo();
  pixels = new Array(gridSize * gridSize).fill('');
  render();
});

// ── SAVE ──────────────────────────────────────────────────────────────────
document.getElementById('btn-save').addEventListener('click', () => {
  // render clean version without grid
  const offscreen = document.createElement('canvas');
  const scale = 8;
  offscreen.width  = gridSize * scale;
  offscreen.height = gridSize * scale;
  const octx = offscreen.getContext('2d');
  octx.fillStyle = '#1a1928';
  octx.fillRect(0, 0, offscreen.width, offscreen.height);
  pixels.forEach((c, i) => {
    if (!c) return;
    const col = i % gridSize;
    const row = Math.floor(i / gridSize);
    octx.fillStyle = c;
    octx.fillRect(col * scale, row * scale, scale, scale);
  });

  // Try Telegram WebApp shareMedia first, fallback to download
  if (window.Telegram?.WebApp) {
    offscreen.toBlob(blob => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          Telegram.WebApp.showAlert('Картинка готова! Скопируй из буфера обмена.');
        } catch(e) {}
      };
      reader.readAsDataURL(blob);
    });
  }

  const link = document.createElement('a');
  link.download = 'pixeldrop.png';
  link.href = offscreen.toDataURL('image/png');
  link.click();
  toast('💾 Сохранено!');
});

// ── TOAST ─────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ── RESIZE ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  resizeCanvas();
  render();
});

// ── TELEGRAM ──────────────────────────────────────────────────────────────
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

// ── START ──────────────────────────────────────────────────────────────────
buildPalette();
initGrid(16);
</script>

</body>
</html>
